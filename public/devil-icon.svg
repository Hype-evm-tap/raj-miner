<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Raj Miner Neon Devil</title><desc id="desc">A sculpted dark devil mask with luminous crimson eyes and violet neon horns.</desc>
<defs>
 <linearGradient id="bg" x1="60" y1="30" x2="450" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#17152d"/><stop offset=".55" stop-color="#080b17"/><stop offset="1" stop-color="#03050c"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#a51d62" stop-opacity=".38"/><stop offset="1" stop-color="#3d1a8a" stop-opacity="0"/></radialGradient>
 <linearGradient id="horn" x1="80" y1="40" x2="420" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#ff6b9d"/><stop offset=".42" stop-color="#a72bdb"/><stop offset="1" stop-color="#3b4cff"/></linearGradient>
 <linearGradient id="face" x1="160" y1="135" x2="360" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#45405e"/><stop offset=".34" stop-color="#171a2c"/><stop offset="1" stop-color="#080a13"/></linearGradient>
 <linearGradient id="ridge" x1="160" y1="150" x2="360" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#b7a4d7"/><stop offset=".4" stop-color="#51466d"/><stop offset="1" stop-color="#171528"/></linearGradient>
