#nav button.on span{background:linear-gradient(#ff7ac8,#ff9d1c);border-color:#fff;padding:0;transform:translateY(-10px) scale(1.12);box-shadow:0 4px 0 #7a2a00,0 0 16px #ffb34788}

/* Raj Miner — Victor-inspired mobile mine layout */
#app.mining{background:#160d39}
#app.mining #top{position:absolute;top:9px;left:9px;right:9px;margin:0;padding:14px 16px 12px;border-radius:25px;background:linear-gradient(145deg,#5635bd 0%,#38218c 58%,#28166f 100%);border:2px solid #9b7cff88;box-shadow:0 9px 0 #1a0d4d,0 16px 30px #05020c99;z-index:6}
#app.mining #top:before{content:"•••";display:block;text-align:center;color:#e6dcff;font-size:22px;letter-spacing:5px;line-height:18px;margin:-3px 0 8px}
#app.mining #top .row{align-items:center;gap:10px}
#app.mining #top .lbl{font-size:11px;font-weight:900;letter-spacing:.12em;color:#d5c9ff}
#app.mining #top .big{font-size:29px;white-space:nowrap}
#app.mining #top .coin{width:34px;height:34px;font-size:18px;box-shadow:0 2px 0 #8b5300}
#app.mining #top .pill{background:#075d4c;color:#6bffd0;font-weight:900;border-radius:20px;padding:5px 9px}
#app.mining #top .btn{min-width:112px;padding:13px 12px;border-radius:18px;font-size:17px;white-space:nowrap;box-shadow:0 5px 0 #a85b00,0 0 20px #ffc92855}
#app.mining #top .bar{height:10px;margin-top:12px;background:#180d4d;border:1px solid #ffffff33;border-radius:20px}
#app.mining #top .bar i{background:linear-gradient(90deg,#ff4d9c,#ff8b32,#ffd22c);border-radius:20px}
#app.mining #view{overflow:hidden}
#app.mining #lvl{top:150px;left:12px;background:linear-gradient(120deg,#2e175eF2,#140c32F2);border:2px solid #a67bff;border-radius:24px;box-shadow:0 5px 16px #0008;padding:7px 13px 7px 7px}
#app.mining #feed{top:210px;left:12px;right:78px;border-radius:19px;box-shadow:0 5px 15px #0008;padding:8px 12px}
#app.mining #nft{top:202px;right:12px;width:66px;height:92px;border-radius:16px;box-shadow:0 5px 16px #0009;border:3px solid #fff0b7;background:linear-gradient(145deg,#fff2b3,#e5a53d 48%,#8c4ac7)}
#app.mining #nft small{background:linear-gradient(#ffe66a,#ff9d1c);border:1px solid #fff8;font-size:9px}
#app.mining #vch{bottom:15px;left:14px;width:82px;height:82px;border-radius:20px;box-shadow:0 5px 0 #27105d,0 0 18px #7e55ff88;border:3px solid #b8a4ff;line-height:76px}
#app.mining #find{display:none}
#app.mining #miner{filter:drop-shadow(0 8px 8px #000c)}
#app.mining #nav{box-shadow:0 -8px 24px #08031d88;border:1px solid #ffffff14}
#app.mining #nav button{font-size:12px;min-width:48px}
#app.mining #nav button.on span{box-shadow:0 0 0 2px #fff7,0 5px 14px #ffbf2c66}
@media(max-height:700px){#app.mining #top{padding:10px 12px 9px}#app.mining #top:before{margin:-2px 0 4px;font-size:17px}#app.mining #lvl{top:128px}#app.mining #feed{top:184px}#app.mining #nft{top:178px}}
@media(max-width:360px){#app.mining #top .big{font-size:24px}#app.mining #top .btn{min-width:96px;font-size:15px;padding:11px 8px}#app.mining #feed{right:72px}}

/* Premium playable mine scene */
#mine{background:linear-gradient(180deg,#20152f 0%,#292238 42%,#171323 100%)!important}
#shaft{background-size:240px 240px;background-repeat:repeat;isolation:isolate}
#shaft:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#ffbd6a20,transparent 42%),linear-gradient(90deg,#09071288,transparent 28%,transparent 72%,#09071288);pointer-events:none;z-index:0}
#ladder{z-index:1}
#ladder:before,#ladder:after{content:"";position:absolute;top:0;bottom:0;width:8px;background:linear-gradient(90deg,#4a2812,#d49a55 45%,#704019);box-shadow:inset 2px 0 2px #fff5,3px 0 6px #0008}
#ladder:before{left:-13px}#ladder:after{right:-13px}
#miner{z-index:5;left:50%;margin-left:-62px;transition:top .8s cubic-bezier(.2,.8,.2,1)}
#miner svg{overflow:visible;filter:drop-shadow(0 7px 5px #0009)}
#pickaxe{position:absolute;z-index:6;left:calc(50% + 28px);top:calc(var(--miner-y,0px) + 35px);width:104px;height:76px;transform-origin:10px 64px;pointer-events:auto;filter:drop-shadow(0 4px 3px #0009);cursor:pointer}
#pickaxe.swinging{animation:pickSwing .36s cubic-bezier(.25,.8,.25,1)}
@keyframes pickSwing{0%{transform:rotate(-42deg)}55%{transform:rotate(48deg)}78%{transform:rotate(12deg)}100%{transform:rotate(0)}}
.rock-cluster{position:absolute;left:calc(50% + 55px);width:170px;height:142px;z-index:4;cursor:pointer;transition:opacity .25s,transform .25s;filter:drop-shadow(0 12px 9px #0009)}
.ore-rock{position:absolute;background:linear-gradient(145deg,#aaa3b8 0%,#777184 28%,#4b465a 70%,#2a2637 100%);border:2px solid #272233;box-shadow:inset 4px 5px 7px #ffffff26,inset -8px -10px 12px #0006,0 5px 0 #15111f;border-radius:28% 42% 30% 22%;clip-path:polygon(10% 18%,31% 0,70% 6%,98% 32%,88% 77%,60% 100%,18% 91%,0 55%)}
.rock-a{left:10px;top:16px;width:112px;height:98px;transform:rotate(-8deg)}
.rock-b{left:80px;top:0;width:78px;height:86px;transform:rotate(12deg);background:linear-gradient(145deg,#aaa4b9,#605a72 55%,#2a2637)}
.rock-c{left:40px;top:75px;width:92px;height:62px;transform:rotate(8deg);background:linear-gradient(145deg,#8e879d,#504b60 65%,#292435)}
.ore-rock:after{content:"";position:absolute;left:16%;top:14%;width:54%;height:20%;background:linear-gradient(90deg,#ffffff42,transparent);transform:rotate(-12deg);border-radius:50%;filter:blur(3px)}
.ore-crystal{position:absolute;z-index:2;left:66px;top:40px;width:54px;height:54px;filter:drop-shadow(0 0 13px #ff315c);animation:crystalGlow 1.8s ease-in-out infinite}
.ore-crystal svg{width:54px;height:54px}
@keyframes crystalGlow{50%{transform:scale(1.13);filter:drop-shadow(0 0 22px #ff315c)}}
.rock-cracks{position:absolute;inset:0;z-index:4;opacity:0;background:linear-gradient(125deg,transparent 44%,#17111f 45%,transparent 47%),linear-gradient(55deg,transparent 48%,#17111f 49%,transparent 51%);pointer-events:none}
.rock-hit{animation:rockShake .18s linear 1}.rock-hit .rock-cracks{opacity:.85}
@keyframes rockShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(5px) rotate(2deg)}}
.rock-broken{opacity:0;transform:scale(.65) rotate(9deg)!important;pointer-events:none}
.debris{position:absolute;left:55%;top:48%;width:12px;height:12px;background:linear-gradient(135deg,#d6d0df,#555064);border:1px solid #211b2d;clip-path:polygon(50% 0,100% 35%,70% 100%,0 70%);z-index:9;animation:debrisFly .7s ease-out forwards}
@keyframes debrisFly{to{transform:translate(var(--dx),var(--dy)) rotate(220deg);opacity:0}}
#hitSpark{position:absolute;left:calc(50% + 102px);top:calc(var(--miner-y,0px) + 55px);z-index:8;color:#fff5a6;font-size:36px;opacity:0;text-shadow:0 0 12px #ffb326;pointer-events:none}
#hitSpark.spark-on{animation:sparkBurst .34s ease-out}
@keyframes sparkBurst{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.4)}}
.mine-level-progress{height:5px;width:100px;border-radius:9px;background:#0006;margin-top:5px;overflow:hidden}
.mine-level-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4c8b,#ffd54c);transition:width .2s}
#mine-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;background:#25165dcc;border:1px solid #bba1ff66;border-radius:20px;padding:7px 13px;font:900 10px system-ui;letter-spacing:.12em;color:#fff;white-space:nowrap;pointer-events:none;animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{50%{opacity:.55;transform:translateX(-50%) scale(.97)}}
#feed,#nft,#lvl,#vch,#find{z-index:8}
#miner{cursor:pointer}
@media(max-width:380px){.rock-cluster{left:calc(50% + 34px);transform:scale(.88);transform-origin:left top}#pickaxe{left:calc(50% + 14px)}}

#miner .miner-fallback{display:block}
